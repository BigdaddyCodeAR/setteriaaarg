<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Setter IA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A08; --panel:#151310; --panel2:#1B1813; --ink:#F3EDDA; --sub:#A99A6E;
    --lead:#221E17; --ai:#D4AF37; --aitxt:#141210; --accent:#D4AF37; --accent2:#8A6D1A;
    --line:#2A2519; --good:#4C9A6A; --warn:#C98A2C; --bad:#A6443A;
  }
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif;}
  .center{min-height:100%; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px; width:100%; max-width:340px;}
  .card h1{font-family:'Fraunces',serif; font-size:1.2rem; margin:0 0 16px; color:var(--accent);}
  input{width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-family:inherit; font-size:.9rem; margin-bottom:10px; background:var(--bg); color:var(--ink);}
  button{width:100%; background:var(--accent); color:var(--aitxt); border:none; border-radius:9px; padding:10px; font-weight:600; font-size:.9rem; cursor:pointer;}
  button:disabled{opacity:.45; cursor:default;}
  .err{color:var(--bad); font-size:.82rem; margin-bottom:8px; min-height:1em;}
  .layout{display:none; height:100%;}
  .layout.show{display:flex;}
  aside{width:270px; flex:none; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column;}
  aside header{padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  aside h2{font-family:'Fraunces',serif; font-size:.95rem; margin:0; color:var(--ink);}
  aside .sub{font-size:.7rem; color:var(--sub); margin-top:2px;}
  .signout{width:auto; background:none; color:var(--sub); font-size:.7rem; border:1px solid var(--line); border-radius:6px; padding:4px 7px;}
  .plist,.clist{flex:1; overflow-y:auto; padding:8px;}
  .item{padding:9px 10px; border-radius:9px; cursor:pointer; font-size:.85rem; margin-bottom:3px; color:var(--ink);}
  .item:hover{background:var(--panel2);} .item.active{background:var(--panel2); box-shadow: inset 2px 0 0 var(--accent); font-weight:500;}
  .item .meta{font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--sub); margin-top:2px;}
  .badge{display:inline-block; padding:1px 6px; border-radius:5px; font-size:.6rem; font-family:'IBM Plex Mono',monospace; margin-right:4px;}
  .badge.status-calificado, .badge.status-meet_propuesto{background:rgba(76,154,106,.18); color:var(--good);}
  .badge.status-meet_agendado{background:rgba(76,154,106,.3); color:var(--good);}
  .badge.status-descartado{background:rgba(166,68,58,.18); color:var(--bad);}
  .badge.status-conversando{background:rgba(169,154,110,.18); color:var(--sub);}
  main{flex:1; display:flex; flex-direction:column; min-width:0; background:
    radial-gradient(circle at 100% 0%, rgba(212,175,55,.05), transparent 45%) var(--bg);}
  .topbar{padding:18px 28px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); box-shadow:0 2px 10px rgba(0,0,0,.25); z-index:2; position:relative;}
  .topbar h3{font-family:'Fraunces',serif; margin:0; font-size:1.1rem; color:var(--ink);}
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:1.25rem; letter-spacing:.06em; color:var(--accent);
    padding-left:16px; border-left:1px solid var(--line);}
  .actions{display:flex; align-items:center; gap:10px;}
  .btnline{width:auto; padding:9px 15px; font-size:.8rem; background:var(--panel2); color:var(--ink); border:1px solid var(--line); font-weight:500;}
  .btnline:hover{border-color:var(--accent); color:var(--accent);}
  .resumenBtn{width:auto; padding:9px 15px; font-size:.8rem;}
  #resumenBox{margin:16px 28px 0; padding:16px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; font-size:.85rem; white-space:pre-wrap; display:none; line-height:1.5;}
  .stats{display:none; gap:12px; margin:18px 28px 0; flex-wrap:wrap;}
  .stats.show{display:flex;}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:110px; flex:1;
    box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .stat .n{font-family:'Fraunces',serif; font-size:1.6rem; color:var(--accent);}
  .stat .l{font-size:.7rem; color:var(--sub); margin-top:3px; text-transform:uppercase; letter-spacing:.03em;}
  .msgs{flex:1; overflow-y:auto; padding:20px 28px 28px; display:flex; flex-direction:column; gap:8px;}
  .row{max-width:75%; display:flex; flex-direction:column;}
  .row.lead{align-self:flex-start;} .row.ai{align-self:flex-end;}
  .bubble{padding:9px 12px; border-radius:14px; font-size:.87rem; line-height:1.4; white-space:pre-wrap;}
  .row.lead .bubble{background:var(--lead); color:var(--ink);} .row.ai .bubble{background:var(--ai); color:var(--aitxt);}
  .placeholder{margin:auto; color:var(--sub); font-size:.85rem;}
  .home{padding-top:4px;}
  .home h4{font-family:'Fraunces',serif; font-size:.95rem; color:var(--sub); font-weight:500; margin:6px 0 14px; text-transform:uppercase; letter-spacing:.05em; font-size:.72rem;}
  .home-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  .leadcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.2); transition:border-color .15s, transform .15s;}
  .leadcard:hover{border-color:var(--accent); transform:translateY(-2px);}
  .leadcard .lc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
  .leadcard .lc-name{font-weight:600; font-size:.92rem; color:var(--ink);}
  .leadcard .lc-meta{font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--sub); margin-top:8px;}
  .empty-hint{color:var(--sub); font-size:.82rem; padding:20px 0;}
</style>
</head>
<body>
<div class="center" id="loginView">
  <div class="card">
    <h1>Dashboard — Setter IA</h1>
    <div class="err" id="loginErr"></div>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Contraseña">
    <button id="loginBtn">Entrar</button>
  </div>
</div>

<div class="layout" id="mainView">
  <aside>
    <header>
      <div>
        <h2 id="meName"></h2>
        <div class="sub" id="meSub"></div>
      </div>
      <button class="signout" id="signout">salir</button>
    </header>
    <div class="plist" id="plist"></div>
  </aside>
  <main>
    <div class="topbar">
      <h3 id="convTitle">Seleccioná un lead</h3>
      <div class="actions">
        <button class="btnline" id="estadoDiaBtn" style="display:none;">Estado del día</button>
        <button class="resumenBtn btnline" id="resumenBtn" style="display:none;">Pedir actualización a la IA</button>
        <div class="brand" id="brand">ECOM</div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="resumenBox"></div>
    <div class="msgs" id="msgs"><div class="placeholder">Elegí un profesional y un lead de la izquierda.</div></div>
  </main>
</div>

<script>
// Completá estos dos valores con los de tu proyecto Supabase (Settings > API).
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let me = null, profesionales = [], selectedProf = null, selectedConv = null;

const $ = id => document.getElementById(id);

$('loginBtn').addEventListener('click', async () => {
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
  if (error) { $('loginErr').textContent = 'Email o contraseña incorrectos.'; return; }
  boot();
});
$('signout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: yo } = await sb.from('profesionales').select('*').eq('auth_user_id', session.user.id).single();
  if (!yo) { $('loginErr').textContent = 'Este usuario no está vinculado a ningún profesional.'; return; }
  me = yo;
  $('loginView').style.display = 'none';
  $('mainView').classList.add('show');
  $('meName').textContent = me.nombre + (me.is_admin ? ' (admin)' : '');
  $('meSub').textContent = me.rubro || '';

  if (me.is_admin) {
    const { data } = await sb.from('profesionales').select('*').order('nombre');
    profesionales = data || [];
    renderProfList();
  } else {
    // un solo profesional: no hace falta selector, se va directo a sus leads
    profesionales = [me];
    $('plist').innerHTML = '';
  }
  selectProf(profesionales[0]);
}

function renderProfList(){
  const wrap = $('plist'); wrap.innerHTML = '';
  if (!me.is_admin) return; // sin selector para un solo profesional
  profesionales.forEach(p => {
    const div = document.createElement('div');
    div.className = 'item' + (selectedProf && selectedProf.id === p.id ? ' active' : '');
    div.textContent = p.nombre + (p.rubro ? ' · ' + p.rubro : '');
    div.addEventListener('click', () => selectProf(p));
    wrap.appendChild(div);
  });
}

function renderStats(convs){
  const total = convs.length;
  const statsEl = $('stats');
  if (!total) { statsEl.classList.remove('show'); statsEl.innerHTML = ''; return; }
  const calificados = convs.filter(c => ['calificado','meet_propuesto','meet_agendado'].includes(c.status)).length;
  const conOferta = convs.filter(c => c.oferta_presentada).length;
  const conMeet = convs.filter(c => ['meet_propuesto','meet_agendado'].includes(c.status)).length;
  const descartados = convs.filter(c => c.status === 'descartado').length;
  const pct = n => total ? Math.round((n / total) * 100) : 0;
  const stat = (n, l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  statsEl.innerHTML =
    stat(total, 'leads totales') +
    stat(pct(calificados) + '%', 'calificados') +
    stat(pct(conOferta) + '%', 'con oferta') +
    stat(pct(conMeet) + '%', 'calendarios enviados') +
    stat(pct(descartados) + '%', 'descartados');
  statsEl.classList.add('show');
}

function timeAgo(iso){
  if (!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.round(diffMs / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return `hace ${min}m`;
  const hs = Math.round(min / 60);
  if (hs < 24) return `hace ${hs}h`;
  return `hace ${Math.round(hs / 24)}d`;
}

function renderHome(convs){
  const wrap = $('msgs');
  wrap.style.margin = ''; wrap.classList.remove('center-empty');
  if (!convs.length) {
    wrap.innerHTML = '<div class="placeholder">Todavía no hay leads para este profesional.</div>';
    return;
  }
  const recientes = convs.slice(0, 12);
  const cards = recientes.map(c => `
    <div class="leadcard" data-id="${c.id}">
      <div class="lc-top">
        <div class="lc-name">${c.lead_nombre || c.subscriber_id}</div>
        <span class="badge status-${c.status}">${c.status}</span>
      </div>
      <div class="lc-meta">${c.etapa} · score ${c.score} · ${timeAgo(c.updated_at)}</div>
    </div>
  `).join('');
  wrap.innerHTML = `<div class="home"><h4>Leads recientes</h4><div class="home-grid">${cards}</div></div>`;
  wrap.querySelectorAll('.leadcard').forEach(card => {
    card.addEventListener('click', () => {
      const c = convs.find(x => String(x.id) === card.dataset.id);
      if (c) selectConv(c, document.querySelector(`#leadsWrap .item[data-id="${c.id}"]`));
    });
  });
}

async function selectProf(p){
  selectedProf = p; selectedConv = null;
  renderProfList();
  $('resumenBtn').style.display = 'inline-block';
  $('estadoDiaBtn').style.display = 'inline-block';
  $('resumenBox').style.display = 'none';
  $('convTitle').textContent = p.nombre + ' — leads';
  $('brand').textContent = (p.nombre || 'ECOM').toUpperCase();
  const { data: convs } = await sb.from('conversaciones').select('*').eq('profesional_id', p.id).order('updated_at', { ascending:false });
  renderStats(convs || []);
  const wrap = $('plist');
  // agrega la lista de leads debajo del selector de profesionales, en su propio bloque
  let leadsWrap = document.getElementById('leadsWrap');
  if (leadsWrap) leadsWrap.remove();
  leadsWrap = document.createElement('div');
  leadsWrap.id = 'leadsWrap';
  leadsWrap.style.borderTop = '1px solid var(--line)';
  leadsWrap.style.marginTop = '6px'; leadsWrap.style.paddingTop = '6px';
  (convs || []).forEach(c => {
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.id = c.id;
    div.innerHTML = `<div>${c.lead_nombre || c.subscriber_id}</div><div class="meta"><span class="badge status-${c.status}">${c.status}</span>${c.etapa} · score ${c.score}</div>`;
    div.addEventListener('click', () => selectConv(c, div));
    leadsWrap.appendChild(div);
  });
  if (!(convs||[]).length) leadsWrap.innerHTML = '<div class="item" style="color:var(--sub);cursor:default;">Sin leads todavía</div>';
  wrap.appendChild(leadsWrap);
  renderHome(convs || []);
}

function parseEval(raw){
  const m = raw.match(/<eval>([\s\S]*?)<\/eval>/);
  const message = raw.replace(/<eval>[\s\S]*?<\/eval>/, '').trim();
  return message.split(/\n\s*---\s*\n/).map(s=>s.trim()).filter(Boolean);
}

async function selectConv(c, el){
  selectedConv = c;
  document.querySelectorAll('#leadsWrap .item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  $('convTitle').textContent = (c.lead_nombre || c.subscriber_id) + ' — ' + c.etapa + ' · ' + c.status;
  const { data: msgs } = await sb.from('mensajes').select('*').eq('conversacion_id', c.id).order('created_at');
  const wrap = $('msgs'); wrap.innerHTML = '';
  (msgs || []).forEach(m => {
    if (m.role === 'user') {
      const row = document.createElement('div'); row.className = 'row lead';
      row.innerHTML = '<div class="bubble"></div>'; row.querySelector('.bubble').textContent = m.content;
      wrap.appendChild(row);
    } else {
      parseEval(m.content).forEach(txt => {
        const row = document.createElement('div'); row.className = 'row ai';
        row.innerHTML = '<div class="bubble"></div>'; row.querySelector('.bubble').textContent = txt;
        wrap.appendChild(row);
      });
    }
  });
  wrap.scrollTop = wrap.scrollHeight;
}

async function pedirResumen(tipo, mensajePensando){
  if (!selectedProf) return;
  $('resumenBox').style.display = 'block';
  $('resumenBox').textContent = mensajePensando;
  const { data: { session } } = await sb.auth.getSession();
  try {
    const res = await fetch(`/api/resumen?profesional_id=${selectedProf.id}&tipo=${tipo}`, {
      headers: { Authorization: `Bearer ${session.access_token}` }
    });
    const data = await res.json();
    $('resumenBox').textContent = data.resumen || data.error || 'No se pudo generar el resumen.';
  } catch (e) {
    $('resumenBox').textContent = 'Error de conexión.';
  }
}

$('resumenBtn').addEventListener('click', () => pedirResumen('general', 'Pensando…'));
$('estadoDiaBtn').addEventListener('click', () => pedirResumen('calidad_dia', 'Analizando la calidad de los leads de hoy…'));

boot();
</script>
</body>
</html>
